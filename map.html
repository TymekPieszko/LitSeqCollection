  const panel = document.createElement('div');

  panel.style.cssText = `
    position: fixed;
    top: 12px;
    left: 12px;
    z-index: 9999;
    background: rgba(255,255,255,0.95);
    border: 1px solid rgba(0,0,0,0.15);
    border-radius: 10px;
    padding: 10px 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    font-family: Arial, sans-serif;
    font-size: 13px;
    color: #111;
  `;

  panel.innerHTML = `

    <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
      <label style="min-width:100px;">Corresponder:</label>

      <select id="corresponder-select" style="min-width:260px; padding:4px 6px;">

        ${corrOptions.map(
          o => `<option value="${o.value}">${o.label}</option>`
        ).join('')}

      </select>
    </div>

    <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
      <label style="min-width:100px;">Species:</label>

      <select id="species-select" style="min-width:260px; padding:4px 6px;">

        <option value="All">All</option>

        ${speciesList.map(
          s => `<option value="${s}">${s}</option>`
        ).join('')}

      </select>
    </div>

    <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
      <label style="min-width:100px;">Ecotype:</label>

      <select id="ecotype-select" style="min-width:260px; padding:4px 6px;">

        <option value="All">All</option>

        ${ecotypeList.map(
          e => `<option value="${e}">${e}</option>`
        ).join('')}

      </select>
    </div>

    <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
      <label style="min-width:100px;">Seq type:</label>

      <select id="seqtype-select" style="min-width:260px; padding:4px 6px;">

        <option value="All">All</option>

        ${sequenceTypeList.map(
          s => `<option value="${s}">${s}</option>`
        ).join('')}

      </select>
    </div>

    <div style="display:flex; align-items:center; gap:10px;">
      <label style="min-width:100px;">Basemap:</label>

      <select id="basemap-select" style="min-width:260px; padding:4px 6px;">

        ${basemapNames.map(
          b => `<option value="${b}" ${b === defaultBasemap ? 'selected' : ''}>${b}</option>`
        ).join('')}

      </select>
    </div>

  `;

  document.body.appendChild(panel);

  const speciesSelect =
    document.getElementById('species-select');

  const ecotypeSelect =
    document.getElementById('ecotype-select');

  const seqtypeSelect =
    document.getElementById('seqtype-select');

  const corresponderSelect =
    document.getElementById('corresponder-select');

  const basemapSelect =
    document.getElementById('basemap-select');

  function updateFigure() {

    const species =
      speciesSelect.value;

    const ecotype =
      ecotypeSelect.value;

    const sequence_type =
      seqtypeSelect.value;

    const corr =
      corrByValue[corresponderSelect.value];

    const visible = gd.data.map(tr => {

      const meta = tr.meta || {};

      // Species and Sequence_type are never merged: "All" means "any trace".
      const spOk = (
        species === 'All'
        ||
        meta.species === species
      );

      const seqOk = (
        sequence_type === 'All'
        ||
        meta.sequence_type === sequence_type
      );

      // Ecotype IS merged: "All" means "show the pooled family" (ALL sentinel).
      const ecoOk = (
        ecotype === 'All'
        ? meta.ecotype === ALL
        : meta.ecotype === ecotype
      );

      // Corresponder has three states, resolved from the dropdown option:
      //   base = ALL           -> everyone pooled       (match corr_base === ALL)
      //   base = email, date=ALL -> that person, pooled  (base match, date === ALL)
      //   base = email, date=day -> that person, that day (base and date match)
      const corrOk = (
        corr.base === ALL
        ? meta.corr_base === ALL
        : (meta.corr_base === corr.base && meta.corr_date === corr.date)
      );

      return spOk && seqOk && ecoOk && corrOk;
    });

    // Marker colours are baked in per trace (species hue, lightened by sample
    // count) and never change, so filtering only toggles visibility.
    Plotly.restyle(
    gd,
    {
        visible: visible
    }
    );
  }

  // Swapping the tile basemap only touches the layout, not the traces. The value
  // may be a Plotly style name or a full MapLibre style object; both are valid.
  function updateBasemap() {

    Plotly.relayout(
      gd,
      { "map.style": basemapStyles[basemapSelect.value] }
    );
  }

  speciesSelect.addEventListener(
    'change',
    updateFigure
  );

  ecotypeSelect.addEventListener(
    'change',
    updateFigure
  );

  seqtypeSelect.addEventListener(
    'change',
    updateFigure
  );

  corresponderSelect.addEventListener(
    'change',
    updateFigure
  );

  basemapSelect.addEventListener(
    'change',
    updateBasemap
  );

  updateFigure();

})();

                        })                };            </script>        </div>
</body>
</html>
