      // DETAILED TRACES

        meta.ecotype === ecotype
      );

      return (
        spOk
        &&
        seqOk
        &&
        ecoOk
        &&
        ecotype !== "All"
      );
    });

    const colors = gd.data.map(tr => {

    if (species === "All") {
        return "gold";
    }

    return tr._original_colors;
    });

    Plotly.restyle(
    gd,
    {
        visible: visible,
        "marker.color": colors
    }
    );
  }

  // Swapping the tile basemap only touches the layout, not the traces.
  function updateBasemap() {

    Plotly.relayout(
      gd,
      { "map.style": basemapSelect.value }
    );
  }

  speciesSelect.addEventListener(
    'change',
    updateFigure
  );

  ecotypeSelect.addEventListener(
    'change',
    updateFigure
  );

  seqtypeSelect.addEventListener(
    'change',
    updateFigure
  );

  basemapSelect.addEventListener(
    'change',
    updateBasemap
  );

  updateFigure();

})();

                        })                };            </script>        </div>
